name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: 

jobs:
  build_and_package:
    name: BUILD-JOB

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    runs-on: ubuntu-slim

    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload findings to the Security tab

    strategy:
      fail-fast: false
      matrix:
        # Specify the languages you want to analyze
        language: ['javascript-typescript']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
    
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
         path: ~/.npm  # Replace this with the directory your package manager caches
         key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

 
      - name: BUILD
        run: npm install

      - name: TEST
        run: echo "code is tested!"

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-1
          path: |
            package*
          rentention days: 10 days

      - name: Deploy
        run: echo 'my code is deployed' 


      - name: rollback
        if: failure()
        run: echo 'rollback is done'
      

        
      
